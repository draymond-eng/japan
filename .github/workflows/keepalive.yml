# Pings the Supabase project daily so the free-tier database never pauses
# from inactivity (Supabase pauses projects idle ~7 days; a paused project
# makes the app error until manually restored).
name: Supabase keep-alive
on:
  schedule:
    - cron: "23 7 * * *"   # daily, 07:23 UTC
  workflow_dispatch: {}     # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -sS -f \
            -H "apikey: sb_publishable_H65vKGnPAyJo2ojZ_yksFQ_UNPpmihe" \
            -H "Authorization: Bearer sb_publishable_H65vKGnPAyJo2ojZ_yksFQ_UNPpmihe" \
            "https://tgcrjsapqfogdagqoccq.supabase.co/rest/v1/votes?select=id&limit=1" > /dev/null
          echo "Supabase pinged OK"
